<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <title>pi-pulse logo mark</title>
  <desc>Minimalist geometric pulse passing through extension blocks</desc>
  <rect width="256" height="256" fill="#09090b" />
  
  <!-- Modular Extension Blocks -->
  <rect x="64" y="64" width="48" height="48" fill="#18181b" stroke="#3f3f46" stroke-width="6"/>
  <rect x="144" y="144" width="48" height="48" fill="#18181b" stroke="#3f3f46" stroke-width="6"/>
  
  <!-- Pulse Signal -->
  <path d="M 0 88 L 88 88 L 88 168 L 256 168" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linejoin="miter"/>
  
  <!-- Accent Nodes -->
  <rect x="82" y="82" width="12" height="12" fill="#a3e635" />
  <rect x="162" y="162" width="12" height="12" fill="#fafaf9" />
</svg>
