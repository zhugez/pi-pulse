<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <title>pi-pulse social preview</title>
  <desc>pi-pulse: Extensions that sharpen your Pi workflow.</desc>
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#09090b"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Huge BG Typography -->
  <text x="500" y="580" fill="#121214" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="420" font-weight="900" letter-spacing="-20" opacity="0.8">PULSE</text>

  <!-- Central Graphic -->
  <g transform="translate(760, 200) scale(1.8)">
    <rect x="64" y="64" width="48" height="48" fill="#18181b" stroke="#3f3f46" stroke-width="6"/>
    <rect x="144" y="144" width="48" height="48" fill="#18181b" stroke="#3f3f46" stroke-width="6"/>
    <path d="M -80 88 L 88 88 L 88 168 L 400 168" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linejoin="miter"/>
    <rect x="82" y="82" width="12" height="12" fill="#a3e635" />
    <rect x="162" y="162" width="12" height="12" fill="#fafaf9" />
  </g>

  <!-- Content -->
  <rect x="120" y="210" width="220" height="38" fill="#27272a"/>
  <text x="138" y="234" fill="#a3e635" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="bold" letter-spacing="1">PI EXTENSION WORKSHOP</text>

  <text x="114" y="340" fill="#fafaf9" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-5">pi-pulse</text>

  <text x="120" y="400" fill="#a1a1aa" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" letter-spacing="-0.5">Extensions that sharpen</text>
  <text x="120" y="445" fill="#a1a1aa" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" letter-spacing="-0.5">your Pi workflow.</text>

  <line x1="120" y1="510" x2="600" y2="510" stroke="#27272a" stroke-width="2"/>
  <rect x="600" y="507" width="6" height="6" fill="#06b6d4"/>
</svg>
